<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tạo mã mật khẩu</title>
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#0f2a1f;color:#e9f3ec;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px}
  .box{background:#173d2d;padding:28px;border-radius:18px;max-width:560px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  h1{margin:0 0 6px;font-size:22px}
  p{color:#b9d4c3;line-height:1.55}
  input{width:100%;box-sizing:border-box;padding:12px 14px;border-radius:10px;border:1px solid #2f6b50;background:#0f2a1f;color:#fff;font-size:16px}
  button{margin-top:12px;padding:12px 18px;border:0;border-radius:10px;background:#f0b429;color:#1b1b1b;font-weight:700;font-size:15px;cursor:pointer}
  code{display:block;margin-top:16px;padding:14px;background:#0f2a1f;border-radius:10px;word-break:break-all;color:#ffd166;font-size:14px;min-height:20px}
  ol{color:#b9d4c3;line-height:1.7;padding-left:20px}
</style>
</head>
<body>
<div class="box">
  <h1>🔑 Tạo mã cho mật khẩu mới</h1>
  <p>Trang này chỉ tính mã trên máy anh, không gửi đi đâu cả.</p>
  <input id="pw" type="text" placeholder="Nhập mật khẩu mới…" autocomplete="off">
  <button id="go">Tạo mã</button>
  <button id="copy" style="background:#2f6b50;color:#fff">Copy mã</button>
  <code id="out"></code>
  <ol>
    <li>Mở file <b>config.js</b>.</li>
    <li>Thay chuỗi trong <b>PASSWORD_SHA256: "…"</b> bằng mã ở trên.</li>
    <li>Lưu file và đẩy lại lên GitHub. Vài phút sau mật khẩu mới có hiệu lực.</li>
  </ol>
</div>
<script src="sha256.js"></script>
<script>
  const out = document.getElementById('out');
  document.getElementById('go').onclick = () => {
    const v = document.getElementById('pw').value.trim();
    out.textContent = v ? sha256(v) : 'Chưa nhập mật khẩu';
  };
  document.getElementById('copy').onclick = () => {
    navigator.clipboard && navigator.clipboard.writeText(out.textContent).then(() => {
      document.getElementById('copy').textContent = 'Đã copy ✓';
    });
  };
</script>
</body>
</html>
